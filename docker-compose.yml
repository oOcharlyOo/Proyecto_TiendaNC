services:
  backend:
    build:
      context: ./Proyecto_TiendaNC
      dockerfile: src/main/docker/Dockerfile.legacy-jar
    ports:
      - "8080:8080"
    container_name: backend
    restart: on-failure
    environment:
      - TZ=America/Mexico_City
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=tiendanc
      - MINIO_PUBLIC_URL=https://minio.laleyendadeldulce.com
      - QUARKUS_HTTP_CORS=true
      - QUARKUS_HTTP_CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:8081,https://laleyendadeldulce.com,https://api.laleyendadeldulce.com
    volumes:
      - backup-trigger:/trigger
      - ./db/backups:/deployments/db/backups
    depends_on:
      - database 
      - minio
    networks:
      - tienda-red

  frontend:
    build:
      context: ./Proyecto_Tienda_frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    container_name: frontend
    environment:
      - TZ=America/Mexico_City
    depends_on:
      - backend
    networks:
      - tienda-red

  database: 
    image: postgres:13
    environment:
      POSTGRES_DB: dulcesnc
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: America/Mexico_City
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    container_name: Dulceria-DB
    ports:
      - "5432:5432" 
    networks:
      - tienda-red

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - tienda-red

  db-backup:
    image: postgres:17
    container_name: db-backup
    environment:
      - TZ=America/Mexico_City
      - PGPASSWORD=password
      - DB_HOST=Dulceria-DB
      - DB_NAME=dulcesnc
      - DB_USER=user
    volumes:
      - ./db/backups:/backups
      - backup-trigger:/trigger
    command: ["sh", "-c", "mkdir -p /trigger && chmod 777 /trigger && while true; do if [ -f /trigger/backup ]; then TIMESTAMP=$$(date +%Y%m%d_%H%M%S); for db in dulcesnc dulcesnc_abarrotera; do BACKUP_FILE=dump-$${db}-$${TIMESTAMP}.sql; echo \"[$$(date)] Iniciando backup de $${db}\"; pg_dump -h $${DB_HOST} -U $${DB_USER} -d $${db} -F c -f /backups/$${BACKUP_FILE}; if [ $$? -eq 0 ]; then echo \"[$$(date)] OK: $${BACKUP_FILE}\"; else echo \"[$$(date)] ERROR en $${db}\"; fi; done; find /backups -name 'dump-*.sql' -mtime +30 -delete; rm -f /trigger/backup; fi; sleep 5; done"]
    restart: unless-stopped
    networks:
      - tienda-red
    depends_on:
      - database

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: >
      tunnel run 
      --token eyJhIjoiNzhmZTUxOGI2OGVlODZjZmJjYjdjMTI2NzY1N2Q2MmIiLCJ0IjoiNWYzNGQwNjYtZDE4NC00NzhhLTk4ZDItYjliMzJkY2M3ZDljIiwicyI6Ik1tWmpOV0kwWXpZdFpHRXpNeTAwTkRBeExXSTNaVFl0WVRCbU9ETTNZbVk1TXpWaSJ9
    environment:
      - TUNNEL_ORIGIN_SERVER_NAME=api.laleyendadeldulce.com
      - NO_TLS_VERIFY=true
      - TUNNEL_METRICS=0.0.0.0:9090
      - TUNNEL_LOGLEVEL=info
    networks:
      - tienda-red
    depends_on:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  tienda-red:
    driver: bridge

volumes:
  db-data:
  minio-data:
  backup-trigger: