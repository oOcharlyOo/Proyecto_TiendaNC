name: proyecto_tiendanc_leyenda

services:
  backend:
    build:
      context: ./Proyecto_TiendaNC
      dockerfile: Dockerfile.jvm
    container_name: leyenda-backend
    restart: on-failure
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
      - MINIO_ENDPOINT=leyenda-minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=tiendanc
      - MINIO_PUBLIC_URL=https://minio.laleyendadeldulce.com
      - QUARKUS_HTTP_CORS=true
      - QUARKUS_HTTP_CORS_ORIGINS=http://localhost:8081,http://127.0.0.1:8081,https://laleyendadeldulce.com,https://www.laleyendadeldulce.com,https://api.laleyendadeldulce.com
      - OLLAMA_URL=http://leyenda-ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - SUCURSAL_MASTER_KEY=${SUCURSAL_MASTER_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - leyenda-backup-trigger:/trigger
      - ./db/backups:/deployments/db/backups
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks:
      - leyenda-red

  frontend:
    build:
      context: ./Proyecto_Tienda_frontend
      dockerfile: Dockerfile
    container_name: leyenda-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
      - VITE_API_URL=https://api.laleyendadeldulce.com
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - leyenda-red

  database:
    image: postgres:13
    container_name: leyenda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulcesnc
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: America/Mexico_City
    volumes:
      - leyenda-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/migrations:/migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d dulcesnc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - leyenda-red

  db-init:
    image: postgres:13
    container_name: leyenda-db-init
    restart: "no"
    env_file:
      - .env
    environment:
      - PGHOST=database
      - PGPASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=dulcesnc
    volumes:
      - ./db/init:/init:ro
      - ./db/migrations:/migrations:ro
    entrypoint: ["sh", "-c", "bash /init/init.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - leyenda-red

  minio:
    image: minio/minio:latest
    container_name: leyenda-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - leyenda-minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - leyenda-red

  db-backup:
    image: postgres:17
    container_name: leyenda-db-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Mexico_City
      - PGPASSWORD=password
      - DB_HOST=database
      - DB_NAME=dulcesnc
      - DB_USER=user
    volumes:
      - ./db/backups:/backups
      - leyenda-backup-trigger:/trigger
    command: ["sh", "-c", "mkdir -p /trigger && chmod 777 /trigger && wget -q -O /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc && chmod +x /usr/local/bin/mc && mc alias set minio http://minio:9000 minioadmin minioadmin 2>/dev/null; while true; do if [ -f /trigger/backup ]; then TIMESTAMP=$$(date +%Y%m%d_%H%M%S); echo \"[$$(date)] === BACKUP COMBINADO ===\"; pg_dump -h $${DB_HOST} -U $${DB_USER} -d dulcesnc -F c -f /tmp/dump-dulcesnc.sql && echo \"[$$(date)] OK: dulcesnc\" || echo \"[$$(date)] ERROR: dulcesnc\"; pg_dump -h $${DB_HOST} -U $${DB_USER} -d dulcesnc_abarrotera -F c -f /tmp/dump-dulcesnc_abarrotera.sql && echo \"[$$(date)] OK: dulcesnc_abarrotera\" || echo \"[$$(date)] ERROR: dulcesnc_abarrotera\"; mkdir -p /tmp/minio-tmp && mc mirror --quiet minio/tiendanc /tmp/minio-tmp/ 2>/dev/null && tar -czf /tmp/minio.tar.gz -C /tmp minio-tmp && rm -rf /tmp/minio-tmp && echo \"[$$(date)] MinIO OK\" || { echo \"[$$(date)] MinIO ERROR - continuando sin MinIO\"; rm -rf /tmp/minio-tmp; }; tar -czf /backups/backup-$${TIMESTAMP}.tar.gz -C /tmp dump-dulcesnc.sql dump-dulcesnc_abarrotera.sql minio.tar.gz 2>/dev/null && echo \"[$$(date)] Backup creado: backup-$${TIMESTAMP}.tar.gz\" || echo \"[$$(date)] Error al crear backup combinado\"; rm -f /tmp/dump-dulcesnc.sql /tmp/dump-dulcesnc_abarrotera.sql /tmp/minio.tar.gz; find /backups -name 'backup-*.tar.gz' -mtime +30 -delete; rm -f /trigger/backup; fi; if [ -f /trigger/restore ]; then RESTORE_FILE=$$(cat /trigger/restore); echo \"[$$(date)] === RESTORE: $${RESTORE_FILE} ===\"; if echo \"$${RESTORE_FILE}\" | grep -q '^backup-'; then echo \"[$$(date)] Formato combinado detectado\"; mkdir -p /tmp/restore && tar -xzf /backups/$${RESTORE_FILE} -C /tmp/restore; RC_DULC=0; RC_ABAR=0; RC_MINIO=0; if [ -f /tmp/restore/dump-dulcesnc.sql ]; then pg_restore -h $${DB_HOST} -U $${DB_USER} -d dulcesnc --clean --if-exists --no-owner /tmp/restore/dump-dulcesnc.sql >/tmp/restore-out 2>/tmp/restore-err; RC_DULC=$$?; echo \"[$$(date)] Restore dulcesnc: rc=$$RC_DULC\"; fi; if [ -f /tmp/restore/dump-dulcesnc_abarrotera.sql ]; then pg_restore -h $${DB_HOST} -U $${DB_USER} -d dulcesnc_abarrotera --clean --if-exists --no-owner /tmp/restore/dump-dulcesnc_abarrotera.sql >/tmp/restore-out 2>/tmp/restore-err; RC_ABAR=$$?; echo \"[$$(date)] Restore abarrotera: rc=$$RC_ABAR\"; fi; if [ -f /tmp/restore/minio.tar.gz ]; then mkdir -p /tmp/minio-restore && tar -xzf /tmp/restore/minio.tar.gz -C /tmp/minio-restore && mc mirror --overwrite --quiet /tmp/minio-restore/minio-tmp/ minio/tiendanc/ 2>/tmp/restore-minio-err; RC_MINIO=$$?; echo \"[$$(date)] Restore MinIO: rc=$$RC_MINIO\"; rm -rf /tmp/minio-restore; fi; rm -rf /tmp/restore; echo \"OK\" > /trigger/restore-result; echo \"[$$(date)] Restore combinado completado (dulcesnc=$$RC_DULC abarrotera=$$RC_ABAR minio=$$RC_MINIO)\"; rm -f /trigger/restore; elif echo \"$${RESTORE_FILE}\" | grep -q 'abarrotera'; then pg_restore -h $${DB_HOST} -U $${DB_USER} -d dulcesnc_abarrotera --clean --if-exists --no-owner /backups/$${RESTORE_FILE} >/tmp/restore-out 2>/tmp/restore-err; RC=$$?; if [ $$RC -le 1 ]; then echo \"OK\" > /trigger/restore-result; else echo \"ERROR\" > /trigger/restore-result; fi; rm -f /trigger/restore; else pg_restore -h $${DB_HOST} -U $${DB_USER} -d dulcesnc --clean --if-exists --no-owner /backups/$${RESTORE_FILE} >/tmp/restore-out 2>/tmp/restore-err; RC=$$?; if [ $$RC -le 1 ]; then echo \"OK\" > /trigger/restore-result; else echo \"ERROR\" > /trigger/restore-result; fi; rm -f /trigger/restore; fi; sleep 5; done"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - leyenda-red

  ollama:
    image: ollama/ollama:latest
    container_name: leyenda-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - leyenda-ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_HOST=0.0.0.0
    networks:
      - leyenda-red

  ollama-init:
    image: ollama/ollama:latest
    container_name: leyenda-ollama-init
    restart: "no"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://leyenda-ollama:11434
    volumes:
      - leyenda-ollama-data:/root/.ollama
    entrypoint: ["sh", "-c", "
      apt-get update -qq && apt-get install -y -qq curl && rm -rf /var/lib/apt/lists/*;
      echo 'Esperando a Ollama...';
      for i in $$(seq 1 30); do
        if curl -s http://leyenda-ollama:11434/api/tags > /dev/null 2>&1; then
          echo 'Descargando llama3.1:8b...';
          ollama pull llama3.1:8b;
          exit 0;
        fi;
        sleep 2;
      done;
      exit 1
    "]
    depends_on:
      - ollama
    networks:
      - leyenda-red

  tunnel:
    container_name: leyenda-cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    env_file:
      - .env
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_LEYENDA}
    environment:
      - TUNNEL_ORIGIN_SERVER_NAME=api.laleyendadeldulce.com
      - NO_TLS_VERIFY=true
      - TUNNEL_METRICS=0.0.0.0:9090
      - TUNNEL_LOGLEVEL=info
    networks:
      - leyenda-red
    depends_on:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  leyenda-red:
    driver: bridge

volumes:
  leyenda-db-data:
  leyenda-minio-data:
  leyenda-backup-trigger:
  leyenda-ollama-data:
